apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    // Android 14 == SDK Level 34. This number should generally be kept up to date with
    // the most recent supported Android release.
    compileSdkVersion 35

    namespace "{{ cookiecutter.package_name }}.{{ cookiecutter.module_name }}"

    defaultConfig {
        applicationId "{{ cookiecutter.package_name }}.{{ cookiecutter.module_name }}"
        versionCode {{ cookiecutter.version_code }}
        versionName "{{ cookiecutter.version }}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Briefcase currently requires API Level 24 for the `pidof` command, and the `--pid`
        // argument to `adb logcat`. This supports over 90% of active devices
        // (https://github.com/beeware/rubicon-java/issues/74).
        minSdkVersion 26
        // This should gnerally match the compileSDKVersion from above.
        targetSdkVersion 34

        python {
            version "{{ cookiecutter.python_version|py_tag }}"
            pip {
                install "-r", "requirements.txt"
            }
            {%- if cookiecutter.extract_packages %}
            extractPackages {{ cookiecutter.extract_packages }}
            {%- endif %}
        }
        ndk {
            {% if cookiecutter.python_version|py_tag in ["3.8", "3.9", "3.10", "3.11"] %}
            // Chaquopy also supports x86, but it's not very useful anymore, so we'll
            // disable it to speed up the build.
            abiFilters "arm64-v8a", "x86_64"
            {% else %}
            // For this Python version, only 64-bit ABIs are available.
            abiFilters "arm64-v8a", "x86_64"
            {% endif %}
        }
    }

    compileOptions {
      sourceCompatibility JavaVersion.VERSION_1_8
      targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            python.srcDirs = [
                "src/main/python",  // App code
                "src/main/python-briefcase",  // Template code
            ]
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar'])
{%- if cookiecutter.build_gradle_dependencies -%}
{%- for lib in cookiecutter.build_gradle_dependencies.implementation %}
    implementation "{{ lib }}"
{%- endfor %}
{% endif -%}
}

task readySource {
    // 'src/java' ==> 'org.ccustom'
    def srcFrom = new File("${projectDir}/../../../../../src/java")
    def srcInto = new File("${projectDir}/src/main/java/org/custom")
    if (!srcFrom.exists()) {
        throw new GradleException("java directory does not exist: ${srcFrom}")
    }
    if (!srcInto.exists()) {
        exec {
            commandLine 'cmd', '/c', "mklink", "/J", srcInto.getAbsolutePath(), srcFrom.getAbsolutePath()
        }
    }

    // 'libs/android' ==> 'libs'
    def libFrom = new File("${projectDir}/../../../../../libs/android")
    def libInto = new File("${projectDir}/libs")
    if (!libFrom.exists()) {
        throw new GradleException("libs directory does not exist: ${libFrom}")
    }
    if (!libInto.exists()) {
        exec {
            commandLine 'cmd', '/c', "mklink", "/J", libInto.getAbsolutePath(), libFrom.getAbsolutePath()
        }
    }
}
preBuild.dependsOn readySource

def readyPatch(conf) {
    def patchFrom = "$projectDir/patched"
    def patchInto = "$projectDir/build/python/jniLibs/$conf"

    ['arm64-v8a', 'x86_64'].each { arch ->
        def fileFrom = new File(patchFrom, "/$arch/libpython3.8.so")
        def fileInto = new File(patchInto, "/$arch/libpython3.8.so")

        if (!fileFrom.exists()) {
            throw GradleException("'$fileFrom' not found")
        }
        if (!fileInto.exists()) {
            throw GradleException("'$fileInto' not found")
        }
        delete "$fileInto"

        copy {
            from "$fileFrom"
            into fileInto.parentFile
        }

        if (!fileInto.exists()) {
            throw GradleException("$fileInto not found")
        }
        println "patched file '$fileInto'"
    }
}
['Debug', 'Release'].each { conf ->
    tasks.register("readyPatch${conf}") {
        doLast {
            readyPatch(conf.toLowerCase())
        }
    }
}
afterEvaluate {
    ['Debug', 'Release'].each { conf ->
        tasks.maybeCreate("generate${conf}PythonJniLibs").finalizedBy "readyPatch${conf}"
    }
}

